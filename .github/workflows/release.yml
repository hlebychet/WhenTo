name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDT="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$CMDT/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSfo /tmp/cmdt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdt.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$CMDT/sdkmanager" --licenses > /dev/null || true
          "$CMDT/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon

      - name: Delete stale release for this tag
        shell: bash
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Prepare release notes
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## WhenTo $GITHUB_REF_NAME"
            echo
            if [ -n "$PREV" ]; then
              echo "### What's new"
              git log "$PREV..HEAD" --no-merges --format='- %s'
            else
              echo "Initial release."
            fi
            echo
            echo "Turn a messenger message into a calendar event in a couple of taps - parsed fully on-device, no network or cloud."
            echo
            echo "### Requirements"
            echo "- Android 8.0 or newer"
            echo "- A phone with Gemini Nano available through AICore (verified on the Pixel 10 series)"
            echo "- Optional one-time on-device model download"
          } > release-notes.md

      - name: Rename APK with version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/release/*.apk WhenTo-v${VERSION}-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: WhenTo ${{ github.ref_name }}
          body_path: release-notes.md
          files: WhenTo-v*-release.apk