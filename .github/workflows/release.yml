name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDT="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$CMDT/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSfo /tmp/cmdt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdt.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$CMDT/sdkmanager" --licenses > /dev/null || true
          "$CMDT/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Write signing config from secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > whento-release.jks
            cat > key.properties <<EOF
            storeFile=${{ github.workspace }}/whento-release.jks
            storePassword=${{ secrets.KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.KEYSTORE_ALIAS }}
            keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
            EOF
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK with version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/release/*.apk WhenTo-v${VERSION}-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: WhenTo-v*-release.apk
          body: |
            ## WhenTo ${{ github.ref_name }}

            Turn a messenger message into a calendar event in a couple of taps —
            parsed fully on-device, no network or cloud.

            ### What's here
            - `WhenTo-v*.release.apk` — installable Android APK (see README for install steps).

            ### Requirements
            - Android 8.0+
            - Phone with Gemini Nano (currently Pixel 10 series)
            - Optional one-time on-device model download